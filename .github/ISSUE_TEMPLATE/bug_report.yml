---
name: Bug report
description: ruru reported something wrong, missed something, or failed to run
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: ruru's output or its `--json` items, and the diff if you can share it. Remove anything private.
      render: text
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.15.2 on Ubuntu 26.04
    validations:
      required: true
